# Node/Baileys stack. Run with:
#   docker compose up -d --build
services:
  bot-core:
    build: ./bot-core
    restart: always
    environment:
      # Set to link by pairing code on first login (digits only, with country code).
      # Leave unset to use QR (shown in the dashboard).
      PAIRING_NUMBER: ${PAIRING_NUMBER:-}
      # Set to "true" then re-link once to pull your full contact/chat list into
      # the approved-senders picker. Leave off for normal running.
      SYNC_FULL_HISTORY: ${SYNC_FULL_HISTORY:-false}
      LOG_LEVEL: info
    extra_hosts:
      # Lets the container reach Auralis running on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      # Baileys session (auth) + SQLite live under /data.
      - ./data:/data
    expose:
      - "5000"

  web:
    build: ./web
    restart: always
    depends_on:
      - bot-core
    ports:
      - "8080:80"

  # Core ComfyUI (bot.paint backend). Always-on via restart policy; reuses the
  # host model/IO/workflow folders via bind mounts. Set COMFYUI_DIR to your
  # ComfyUI install path (forward slashes on Windows).
  comfyui:
    build: ./comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - ${COMFYUI_DIR:-C:/Edit/ComfyUI}/models:/app/ComfyUI/models
      - ${COMFYUI_DIR:-C:/Edit/ComfyUI}/input:/app/ComfyUI/input
      - ${COMFYUI_DIR:-C:/Edit/ComfyUI}/output:/app/ComfyUI/output
      - ${COMFYUI_DIR:-C:/Edit/ComfyUI}/user:/app/ComfyUI/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
