# docker-compose.yml (Definitive Version)
services:
  whatsapp-bot:
    build: .
    ports:
      - "5000:5000"
    shm_size: '1g'
    volumes:
      # These volumes ensure your config, session data, and logs persist on your local machine.
      - ./config:/home/appuser/app/config
      - ./user_data:/home/appuser/app/user_data
      - ./logs:/home/appuser/app/logs