; supervisord.conf
[supervisord]
nodaemon=true
loglevel=warn
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:whatsapp_bot]
command=python -u main.py
directory=/home/appuser/app
user=appuser
autostart=true
autorestart=true ; This is the key for automatic restarts of your bot process
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
startretries=5
startsecs=10