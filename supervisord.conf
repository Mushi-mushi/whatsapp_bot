; supervisord.conf
[supervisord]
nodaemon=true
loglevel=info
logfile=/home/appuser/app/logs/supervisord.log ; Direct supervisord's log to a volume

[program:whatsapp_bot]
command=python -u main.py
directory=/home/appuser/app
user=appuser
autostart=true
autorestart=true ; This is the key for automatic restarts of your bot process
stdout_logfile=/home/appuser/app/logs/whatsapp_bot_stdout.log
stderr_logfile=/home/appuser/app/logs/whatsapp_bot_stderr.log
stopasgroup=true
killasgroup=true
startretries=5
startsecs=10