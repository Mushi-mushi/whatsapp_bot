name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bot-core/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: bot-core
      - run: npm run typecheck
        working-directory: bot-core
      - run: npm run lint
        working-directory: bot-core
      - run: npm test
        working-directory: bot-core
      - run: npm run build
        working-directory: bot-core
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web